function screenContent(key){return key==='overview'?overview():key==='etf'?etf():key==='ai'?ai():quant()}
function phone(dir,key){return `<div class="phone ${dir.className} ${theme==='dark'?'dark':''}" data-screen="${key}"><div class="island"></div><div class="status"><span>9:41</span><span>●●●　◖　▰</span></div><div class="view">${screenContent(key)}</div><nav class="nav">${[['overview','⌂','总览'],['etf','⌁','行情'],['ai','✳','AI 决策'],['quant','▤','量化'],['overview','◷','资产']].map(([s,icon,n])=>`<button class="${key===s?'active':''}" onclick="navTo('${s}')"><b>${icon}</b>${n}</button>`).join('')}</nav></div>`}
function render(){const c=document.getElementById('compare');c.innerHTML=dirs.map(d=>`<article class="direction"><h2>${d.name}</h2><p class="desc">${d.desc}</p><div class="tools"><div class="seg">${screens.map((s,i)=>`<button class="${i===0?'active':''}" data-screen-btn="${s}" onclick="setScreen('${d.id}','${s}',this)">${meta[s][0]}</button>`).join('')}</div><div class="seg"><button class="active" data-theme-btn="light" onclick="setTheme('${d.id}','light',this)">浅色</button><button data-theme-btn="dark" onclick="setTheme('${d.id}','dark',this)">深色</button></div></div><div class="screen-wrap">${phone(d,'overview')}</div></article>`).join('')}
function setTheme(id,t,btn){theme=t;const dir=dirs.find(x=>x.id===id),article=btn.closest('.direction');article.querySelectorAll('[data-theme-btn]').forEach(x=>x.classList.toggle('active',x===btn));const p=article.querySelector('.phone');p.classList.toggle('dark',t==='dark')}
function setScreen(id,s,btn){const article=btn.closest('.direction'),dir=dirs.find(x=>x.id===id);article.querySelectorAll('[data-screen-btn]').forEach(x=>x.classList.toggle('active',x===btn));article.querySelector('.screen-wrap').innerHTML=phone(dir,s)}
function navTo(s){const p=event.currentTarget.closest('.phone'),d=dirs.find(x=>p.classList.contains(x.className));p.outerHTML=phone(d,s)}function selectStrategy(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function toggleFull(){const p=event.currentTarget.closest('.phone');if(p.querySelector('.fullscreen'))p.querySelector('.fullscreen').remove();else p.insertAdjacentHTML('beforeend',full())}
document.getElementById('global').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#global .pill').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.mode){document.body.classList.toggle('compare-mode',b.dataset.mode==='showcase');return}if(b.dataset.theme){theme=b.dataset.theme;document.querySelectorAll('.phone').forEach(p=>p.classList.toggle('dark',theme==='dark'));document.querySelectorAll('[data-theme-btn]').forEach(x=>x.classList.toggle('active',x.dataset.themeBtn===theme))}});render();
